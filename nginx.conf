# =============================================================================
# Nginx Configuration — Frontend + Reverse Proxy to Spring Boot Backend
# =============================================================================
# This config runs INSIDE the Docker container.
# For HTTPS/SSL, use a separate Nginx or Cloudflare OUTSIDE Docker.
# =============================================================================

# --- Performance tuning ---
gzip on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;
gzip_min_length 256;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;

# --- Rate limiting — prevent API abuse ---
# 10 requests/sec per IP. Without this, one user spamming /api/chat/stream
# can overload the backend and affect all other users.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security Headers ---
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;

    # -----------------------------------------------------------------
    # Static assets with Vite content hash — safe to cache for 1 year
    # Files like: /assets/main-mc4swnFX.js, /assets/main-BDi_isge.css
    # -----------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        # NGINX GOTCHA: add_header in a nested block OVERRIDES ALL parent headers.
        # Must re-add every security header here, not just one.
        add_header X-Content-Type-Options  "nosniff" always;
        add_header X-Frame-Options         "DENY" always;
        add_header X-XSS-Protection        "1; mode=block" always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    }

    # -----------------------------------------------------------------
    # Frontend SPA — serve index.html for all unknown routes
    # -----------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -----------------------------------------------------------------
    # Reverse Proxy — Spring Boot Backend API
    #
    # "spring-ai" là tên container trong docker-compose.prod.yml
    # của Backend. Cả hai cùng tham gia "shared-network" (external)
    # nên Nginx gọi trực tiếp bằng tên container, không đi qua host.
    #
    # Ưu điểm so với host.docker.internal:
    #   • Không lộ port 8080 ra internet
    #   • Kết nối trực tiếp, nhanh hơn
    #   • Ổn định trên mọi Linux
    # -----------------------------------------------------------------
    location /api/ {
        # Rate limit — returns 429 Too Many Requests when exceeded
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://spring-ai:8080/api/;

        # Forward client info to backend
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CRITICAL: Disable buffering for SSE (Server-Sent Events) streaming
        # Without this, AI chat responses are buffered and only shown after completion
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;

        # Timeouts — AI responses can take time
        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
        proxy_send_timeout    60s;

        # Allow large file uploads (RAG document upload, max 50MB)
        client_max_body_size 50M;
    }

    # -----------------------------------------------------------------
    # Error pages
    # -----------------------------------------------------------------
    error_page 404 /index.html;
}
